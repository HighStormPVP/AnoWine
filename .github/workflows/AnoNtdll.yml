name: AnoWine ntdll

# Builds ntdll.so variants and compares them with the one shipped in runtime
# v3.1.3, to establish which source the shipped build used before the loader
# is renamed to ano-core. Each variant uploads its ntdll.so.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/anowine/build-ntdll.sh'
      - 'scripts/anowine/patches/**'
      - '.github/workflows/AnoNtdll.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SHIPPED_RUNTIME: https://github.com/HighStormPVP/AnoWine/releases/download/v3.1.3/Libraries.tar.gz
  GCENX_PATCH: https://raw.githubusercontent.com/Gcenx/macports-wine/e7dc06979bf216987f9e6e990fc3b21ee2f69db9/emulators/wine-stable/files/llvm-mingw_fixes.patch
  GCENX_PATCH_SHA256: 8e31a093274ad71e1490c5a65cf18a6817f8bfb269c9218fb0659f13a4ccff3

jobs:
  build:
    name: ntdll.so (${{ matrix.variant }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        variant: [vanilla, gcenx, ano-core]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rosetta
        run: /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license

      - name: Patches for this variant
        run: |
          : > "$RUNNER_TEMP/patches"
          if [ "${{ matrix.variant }}" = gcenx ]; then
            curl -fsSL -o "$RUNNER_TEMP/gcenx.patch" "$GCENX_PATCH"
            echo "$GCENX_PATCH_SHA256  $RUNNER_TEMP/gcenx.patch" | shasum -a 256 -c -
            echo "$RUNNER_TEMP/gcenx.patch" >> "$RUNNER_TEMP/patches"
          fi
          if [ "${{ matrix.variant }}" = ano-core ]; then
            echo "$GITHUB_WORKSPACE/scripts/anowine/patches/ntdll-ano-core.patch" >> "$RUNNER_TEMP/patches"
          fi

      - name: Build
        run: |
          xargs bash "$GITHUB_WORKSPACE/scripts/anowine/build-ntdll.sh" "$RUNNER_TEMP/out" < "$RUNNER_TEMP/patches"

      - name: Compare with the shipped ntdll.so
        run: |
          curl -fsSL "$SHIPPED_RUNTIME" | tar -xzf - -C "$RUNNER_TEMP" Libraries/Wine/lib/wine/x86_64-unix/ntdll.so
          SHIPPED="$RUNNER_TEMP/Libraries/Wine/lib/wine/x86_64-unix/ntdll.so"
          BUILT="$RUNNER_TEMP/out/ntdll.so"
          for f in "$SHIPPED" "$BUILT"; do
            echo "== $f"; size -m "$f" | grep -E "Section __text|Section __cstring|Section __const|total"
            otool -l "$f" | grep -A3 LC_BUILD_VERSION | grep -E "minos|sdk"
          done
          nm -gU "$SHIPPED" | awk '{print $3}' | sort > shipped.syms
          nm -gU "$BUILT" | awk '{print $3}' | sort > built.syms
          echo "exported symbols: shipped $(wc -l < shipped.syms), built $(wc -l < built.syms)"
          echo "only in shipped:"; comm -23 shipped.syms built.syms | head -20
          echo "only in built:"; comm -13 shipped.syms built.syms | head -20
          echo "loader strings in built:"; grep -ao '%s%s/[a-z-]*' "$BUILT" | sort -u

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ntdll-${{ matrix.variant }}
          path: ${{ runner.temp }}/out/ntdll.so
          if-no-files-found: error
