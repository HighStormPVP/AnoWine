name: Ano Engine

# Plan 3b: Ano builds upstream's GPTK engine itself (scripts/anowine/build-engine.sh)
# and proves the result equals upstream's v4.8.3. Job `check` compares runtimes
# with scripts/anowine/compare_runtimes.py; first it checks the comparator on
# real runtimes: upstream's engine must equal itself, and Ano 4.9.0 (a repack
# with renamed files and rebuilt modules) must not equal it.
# Plan 3c: version 5.0.0 or later builds Ano's renamed engine instead, and
# `check` makes a bottle with it and runs the gate (wine_tokens.py --gate):
# every "wine" token in the engine and the bottle must be on the allowlist.
# Dispatch only. A build holds a Mac runner for 1.5 to 2 hours; to work on
# `check` alone, pass engine_run to reuse an earlier run's engine.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Engine version: 4.x is upstream's v4.8.3 rebuilt, 5.0.0 or later Ano's renamed engine"
        type: string
        default: "4.8.3"
      engine_run:
        description: "Skip the build and compare the ano-engine artifact of this run ID"
        type: string
        default: ""

permissions:
  contents: read
  actions: read

env:
  REF_URL: https://github.com/frankea/Whisky/releases/download/v4.8.3/Libraries.tar.gz
  REF_SHA: 08ffabd7b7c352470faee2b1d51061b341316e401439ca805c5302acc2fb8818
  ANO490_URL: https://github.com/HighStormPVP/AnoWine/releases/download/v4.9.0/Libraries.tar.gz
  ANO490_SHA: 7951aa539c1e0f371b4f5083c31599e582f902c33f80617321d745cc164743e5

jobs:
  # Plan 3c-2: what the 5.x engine takes from outside Wine and can build without
  # it (DXVK from source, renamed) is made on Linux, where runners are plentiful.
  payloads:
    name: Payloads (Linux)
    if: inputs.engine_run == '' && !startsWith(inputs.version, '4.')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # The runner's Ubuntu mirror has served the 157 MB of packages at 100 kB/s
      # (24 minutes): keep the downloaded packages between runs.
      - name: Package cache
        uses: actions/cache@v5
        with:
          path: ~/apt-cache
          key: payloads-apt-noble-${{ hashFiles('.github/workflows/AnoEngine.yml') }}
          restore-keys: payloads-apt-noble-
      - name: Tools
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends -o Dir::Cache::archives="$HOME/apt-cache" \
            g++-mingw-w64-x86-64-posix g++-mingw-w64-i686-posix meson ninja-build glslang-tools msitools gcab
          sudo chmod -R a+rX ~/apt-cache
          # DXVK's releases use the posix thread model (winpthreads).
          for triplet in x86_64-w64-mingw32 i686-w64-mingw32; do
            for tool in gcc g++; do
              sudo update-alternatives --set "$triplet-$tool" "/usr/bin/$triplet-$tool-posix"
            done
          done
      - name: Build
        run: scripts/anowine/build-payloads.sh "$RUNNER_TEMP/payloads"
      - name: Upload the payloads
        uses: actions/upload-artifact@v7
        with:
          name: ano-payloads
          path: ${{ runner.temp }}/payloads
          if-no-files-found: error

  # Plan 3c-5: the renamed tree and its checks (rename_sources.py, the
  # patches/rename patches, the spawn-site scan, stale lengths) on Linux, so a
  # tree that fails them never takes a Mac runner. The Mac build runs them again.
  sources:
    name: Renamed source (Linux)
    if: inputs.engine_run == '' && !startsWith(inputs.version, '4.')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Rename and check
        env:
          ANO_ENGINE_VERSION: ${{ inputs.version }}
          ANO_ENGINE_PHASES: fetch_sources apply_patches rename_sources
        run: scripts/anowine/build-engine.sh "$RUNNER_TEMP/out"
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ano-sources-logs
          path: |
            ${{ runner.temp }}/ano-engine/build-info.txt
            ${{ runner.temp }}/ano-engine/logs/
          if-no-files-found: warn
          retention-days: 14

  # Plan 3c-5: each component's license texts, word for word from its source
  # (scripts/anowine/licenses.txt; collect_licenses.py). On Linux, so a
  # manifest that no longer matches nixpkgs never takes a Mac runner; the
  # build ships what this job collects.
  licenses:
    name: License texts (Linux)
    if: inputs.engine_run == '' && !startsWith(inputs.version, '4.')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
        with:
          determinate: false
      # libpsl's source is a .tar.lz, which tar reads through lzip.
      - name: lzip
        run: sudo apt-get install -y -q --no-install-recommends lzip
      - name: Collect
        env:
          ANO_ENGINE_VERSION: ${{ inputs.version }}
          ANO_ENGINE_PHASES: collect_licenses
        run: scripts/anowine/build-engine.sh "$RUNNER_TEMP/out"
      - name: Upload the license texts
        uses: actions/upload-artifact@v7
        with:
          name: ano-licenses
          path: ${{ runner.temp }}/ano-engine/licenses
          if-no-files-found: error
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ano-licenses-logs
          path: |
            ${{ runner.temp }}/ano-engine/build-info.txt
            ${{ runner.temp }}/ano-engine/logs/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build the engine
    needs: [payloads, sources, licenses]
    if: >-
      inputs.engine_run == '' && !cancelled()
      && (needs.payloads.result == 'success' || needs.payloads.result == 'skipped')
      && (needs.sources.result == 'success' || needs.sources.result == 'skipped')
      && (needs.licenses.result == 'success' || needs.licenses.result == 'skipped')
    runs-on: macos-15
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Upstream's v4.8.3 was built in its checkout, and lsteamclient.so keeps
      # the absolute path of every object it links (it is compiled with -g), so
      # an equal engine has to be built in the same folder. Ano's engine is
      # built in a folder without "wine" in its name.
      - name: Work folder
        env:
          VERSION: ${{ inputs.version }}
        run: |
          case "$VERSION" in
            4.*) echo "ANO_ENGINE_WORK=/Users/runner/work/winecx-gptk/winecx-gptk" >> "$GITHUB_ENV" ;;
            *) echo "ANO_ENGINE_WORK=$RUNNER_TEMP/ano-engine" >> "$GITHUB_ENV" ;;
          esac

      - name: Rosetta
        run: /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license

      # The Xcode that built upstream's v4.8.3; build-engine.sh stops unless
      # the SDK is macOS 15.
      - name: Xcode 16.4
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: "16.4"

      # gcc for the Windows half, not llvm-mingw (see build-engine.sh).
      - name: ccache and mingw-w64
        run: |
          for formula in ccache mingw-w64; do
            brew list --versions "$formula" > /dev/null || brew install -q "$formula"
          done

      # The renamed tree shares no compile with upstream's, so it has a cache
      # of its own.
      - name: Compiler cache key
        id: key
        env:
          VERSION: ${{ inputs.version }}
        run: |
          winecx=$(sed -n 's/^WINECX_COMMIT=//p' scripts/anowine/build-engine.sh)
          case "$VERSION" in
            4.*) echo "prefix=ccache-$winecx" >> "$GITHUB_OUTPUT" ;;
            *) echo "prefix=ccache-ano-$winecx" >> "$GITHUB_OUTPUT" ;;
          esac

      # Restored and saved as two steps so a build that fails after the
      # compile still keeps it (the one-step cache saves only on success).
      - name: Compiler cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.ccache
          key: ${{ steps.key.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.key.outputs.prefix }}-

      - name: Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
        with:
          determinate: false
          extra-conf: |
            extra-platforms = x86_64-darwin

      - name: Payloads
        if: "!startsWith(inputs.version, '4.')"
        uses: actions/download-artifact@v8
        with:
          name: ano-payloads
          path: ${{ runner.temp }}/payloads

      - name: License texts
        if: "!startsWith(inputs.version, '4.')"
        uses: actions/download-artifact@v8
        with:
          name: ano-licenses
          path: ${{ runner.temp }}/licenses

      # Plan 3c-2: DXMT builds with LLVM 15, about 25 minutes cold. Its key is the
      # pin line in build-engine.sh; saved as soon as it exists, whatever follows.
      - name: LLVM key
        id: llvm
        if: "!startsWith(inputs.version, '4.')"
        run: echo "key=llvm-$(sed -n 's/^LLVM_COMMIT=//p' scripts/anowine/build-engine.sh)-x86_64-darwin" >> "$GITHUB_OUTPUT"
      - name: LLVM cache
        id: llvm_cache
        if: "!startsWith(inputs.version, '4.')"
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/llvm-15
          key: ${{ steps.llvm.outputs.key }}

      - name: Build
        env:
          ANO_ENGINE_VERSION: ${{ inputs.version }}
          ANO_PAYLOADS: ${{ runner.temp }}/payloads
          ANO_LICENSES: ${{ runner.temp }}/licenses
          ANO_LLVM_DIR: ${{ runner.temp }}/llvm-15
        run: scripts/anowine/build-engine.sh "$RUNNER_TEMP/out"

      - name: LLVM built
        id: llvm_built
        if: always() && !startsWith(inputs.version, '4.') && steps.llvm_cache.outputs.cache-hit != 'true'
        run: |
          if [ -f "$RUNNER_TEMP/llvm-15/lib/libLLVMCore.a" ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; fi
      - name: Save LLVM
        if: always() && steps.llvm_built.outputs.yes == 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/llvm-15
          key: ${{ steps.llvm.outputs.key }}

      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ~/.ccache
          key: ${{ steps.key.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload the engine
        uses: actions/upload-artifact@v7
        with:
          name: ano-engine
          path: ${{ runner.temp }}/out/
          if-no-files-found: error
          retention-days: 14

      - name: Upload the build logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ano-engine-logs
          path: |
            ${{ env.ANO_ENGINE_WORK }}/build-info.txt
            ${{ env.ANO_ENGINE_WORK }}/logs/
            ${{ env.ANO_ENGINE_WORK }}/build/config.log
          if-no-files-found: warn
          retention-days: 14

  check:
    name: Compare with upstream's v4.8.3
    needs: build
    if: always() && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.engine_run != ''))
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rosetta
        run: /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license

      - name: Reference runtimes
        if: startsWith(inputs.version, '4.')
        run: |
          fetch() { # fetch <dir> <url> <sha256>
            curl -fsSL --retry 8 --retry-delay 5 --retry-all-errors -o "$RUNNER_TEMP/$1.tar.gz" "$2"
            echo "$3  $RUNNER_TEMP/$1.tar.gz" | shasum -a 256 -c -
            mkdir -p "$RUNNER_TEMP/$1"
            tar -xzf "$RUNNER_TEMP/$1.tar.gz" -C "$RUNNER_TEMP/$1"
            rm "$RUNNER_TEMP/$1.tar.gz"
          }
          fetch ref "$REF_URL" "$REF_SHA"
          fetch ano490 "$ANO490_URL" "$ANO490_SHA"
          mkdir -p "$RUNNER_TEMP/reports"

      - name: "Self-check 1: upstream's engine equals itself"
        if: startsWith(inputs.version, '4.')
        run: |
          set +e
          python3 scripts/anowine/compare_runtimes.py "$RUNNER_TEMP/ref" "$RUNNER_TEMP/ref" \
            --report "$RUNNER_TEMP/reports/self1.txt" > /dev/null
          code=$?
          set -e
          head -1 "$RUNNER_TEMP/reports/self1.txt"
          [ "$code" -eq 0 ] || { echo "::error::exit $code, expected 0"; exit 1; }
          grep -q ' interface=0 different=0 ' "$RUNNER_TEMP/reports/self1.txt"

      - name: "Self-check 2: Ano 4.9.0 is not upstream's engine"
        if: startsWith(inputs.version, '4.')
        run: |
          set +e
          python3 scripts/anowine/compare_runtimes.py "$RUNNER_TEMP/ano490" "$RUNNER_TEMP/ref" \
            --report "$RUNNER_TEMP/reports/self2.txt" > /dev/null
          code=$?
          set -e
          head -1 "$RUNNER_TEMP/reports/self2.txt"
          grep -v '^summary' "$RUNNER_TEMP/reports/self2.txt" | cut -f1 | sort | uniq -c
          [ "$code" -eq 1 ] || { echo "::error::exit $code, expected 1"; exit 1; }
          for line in $'different\tLibraries/Wine/lib/wine/x86_64-unix/ntdll.so\t' \
                      $'only-in-ours\tLibraries/Wine/bin/ano-loader\t'; do
            grep -qF "$line" "$RUNNER_TEMP/reports/self2.txt" \
              || { echo "::error::missing report line: $line"; exit 1; }
          done

      - name: Our engine
        uses: actions/download-artifact@v8
        with:
          name: ano-engine
          path: ${{ runner.temp }}/ours-download
          run-id: ${{ inputs.engine_run || github.run_id }}
          github-token: ${{ github.token }}

      - name: Unpack our engine
        id: unpack
        run: |
          mkdir -p "$RUNNER_TEMP/reports"
          cd "$RUNNER_TEMP/ours-download"
          shasum -a 256 -c Libraries.tar.gz.sha256
          mkdir -p "$RUNNER_TEMP/ours"
          tar -xzf Libraries.tar.gz -C "$RUNNER_TEMP/ours"
          cp build-info.txt "$RUNNER_TEMP/reports/"
          cat build-info.txt

      # Plan 3c-5: every file of Ano's runtime belongs to a component of
      # scripts/anowine/licenses.txt, whose license texts ship in
      # share/ano/licenses and which NOTICES lists.
      - name: License texts
        if: always() && steps.unpack.outcome == 'success' && !startsWith(inputs.version, '4.')
        run: scripts/anowine/check-licenses.sh "$RUNNER_TEMP/ours/Libraries"

      # Plan 3c-5, Task 1: ntdll.so exports the helpers that drop D3DMetal's
      # old names (patches/rename/0006), the printing, NTLM and smbpasswd
      # helpers' libraries take them from it, and the build's spawn-site scan
      # passed.
      - name: Alias helpers in the unix libraries
        if: always() && steps.unpack.outcome == 'success' && !startsWith(inputs.version, '4.')
        run: |
          U="$RUNNER_TEMP/ours/Libraries/Ano/lib/ano/x86_64-unix"
          exported=$(nm -gU "$U/ntdll.so")
          for symbol in _ano_env_without_aliases _ano_env_unset_aliases; do
            grep -E " T $symbol\$" <<< "$exported" || { echo "::error::ntdll.so does not export $symbol"; exit 1; }
          done
          for lib in localspl msv1_0 netapi32; do
            echo "$lib.so:"
            nm -m "$U/$lib.so" | grep -F _ano_env_ || { echo "::error::$lib.so does not use the helpers"; exit 1; }
          done
          grep -F 'spawn sites: ' "$RUNNER_TEMP/ours-download/build-info.txt" \
            || { echo "::error::build-info.txt has no spawn-site scan"; exit 1; }

      # Exit 0: reproduced. Exit 2: equal only by interface; every such file
      # must be explained by a toolchain difference in build-info.txt (Plan 3b
      # records each in spikes/REPORT.md). Exit 1: a real difference.
      - name: Compare with upstream's v4.8.3
        if: startsWith(inputs.version, '4.')
        run: |
          set +e
          python3 scripts/anowine/compare_runtimes.py "$RUNNER_TEMP/ours" "$RUNNER_TEMP/ref" \
            --report "$RUNNER_TEMP/reports/compare.txt" \
            --expect-different Libraries/Wine/lib/external/README \
            --explained-interface scripts/anowine/engine-483-interface.txt > /dev/null
          code=$?
          set -e
          head -1 "$RUNNER_TEMP/reports/compare.txt"
          grep -v '^summary' "$RUNNER_TEMP/reports/compare.txt" | cut -f1 | sort | uniq -c
          grep -v '^summary' "$RUNNER_TEMP/reports/compare.txt" | head -200
          for plist in "$RUNNER_TEMP/ours/Libraries/WhiskyWineVersion.plist" \
                       "$RUNNER_TEMP/ours-download/WhiskyWineVersion.plist"; do
            cmp "$plist" "$RUNNER_TEMP/ref/Libraries/WhiskyWineVersion.plist"
          done
          case "$code" in
            0) echo "reproduced: equal to upstream's v4.8.3 (interface rows only where explained)" ;;
            2) echo "::error::interface rows not in engine-483-interface.txt: explain each file"; exit 1 ;;
            *) echo "::error::compare_runtimes.py exit $code: not upstream's v4.8.3"; exit 1 ;;
          esac

      # Plan 3c's gate starts from this: every "wine" token in the engine and
      # in a new bottle made with it, with the not-Wine allowlist applied.
      - name: New bottle from our engine
        if: always() && steps.unpack.outcome == 'success' && startsWith(inputs.version, '4.')
        timeout-minutes: 20
        run: |
          W="$RUNNER_TEMP/ours/Libraries/Wine"
          export WINEPREFIX="$RUNNER_TEMP/prefix" DYLD_FALLBACK_LIBRARY_PATH="$W/lib"
          export WINEDLLOVERRIDES="mscoree=d;mshtml=d" WINEDEBUG=-all
          "$W/bin/wine64" wineboot --init
          "$W/bin/wineserver" -w
          ls "$WINEPREFIX"

      - name: Wine token inventory
        if: always() && steps.unpack.outcome == 'success' && startsWith(inputs.version, '4.')
        run: |
          python3 scripts/anowine/wine_tokens.py "$RUNNER_TEMP/ours/Libraries" "$RUNNER_TEMP/prefix" \
            --allowlist scripts/anowine/wine-allowlist.txt --out "$RUNNER_TEMP/tokens.tsv"
          head -40 "$RUNNER_TEMP/tokens.tsv"
          echo "not-wine candidates:"
          awk -F'\t' '$2 == "not-wine-candidate"' "$RUNNER_TEMP/tokens.tsv"

      # Plan 3c: Ano's engine and a new bottle made with it, through the gate.
      - name: New bottle from Ano's engine
        id: bottle
        if: always() && steps.unpack.outcome == 'success' && !startsWith(inputs.version, '4.')
        timeout-minutes: 20
        run: |
          A="$RUNNER_TEMP/ours/Libraries/Ano"
          export ANOPREFIX="$RUNNER_TEMP/bottle" DYLD_FALLBACK_LIBRARY_PATH="$A/lib"
          export ANODLLOVERRIDES="mscoree=d;mshtml=d" ANODEBUG=-all
          "$A/bin/ano-loader" ano-boot --init
          "$A/bin/ano-server" -w
          ls "$ANOPREFIX"
          echo "system32: $(ls "$ANOPREFIX/drive_c/windows/system32" | wc -l) files"

      - name: The gate
        if: always() && steps.bottle.outcome == 'success'
        run: |
          python3 scripts/anowine/wine_tokens.py "$RUNNER_TEMP/ours/Libraries" "$RUNNER_TEMP/bottle"             --allowlist scripts/anowine/wine-allowlist.txt --out "$RUNNER_TEMP/tokens.tsv" --gate

      # Plan 3c-1 Task 4: a stand-in for Apple's D3DMetal must still load.
      - name: Hidden aliases for closed parts
        if: always() && steps.bottle.outcome == 'success'
        timeout-minutes: 15
        run: |
          brew list --versions mingw-w64 > /dev/null || brew install -q mingw-w64
          scripts/anowine/check-aliases.sh "$RUNNER_TEMP/ours/Libraries/Ano" "$RUNNER_TEMP/bottle"

      # Plan 3c-4a, Task 6: Apple's D3DMetal reads WINED3DMETAL and WINEESYNC
      # itself; the engine sets them from ANOD3DMETAL and ANOESYNC inside each
      # process only (patches/rename/0005), never in an environment anyone sees.
      - name: D3DMetal's variables, a hidden alias
        if: always() && steps.bottle.outcome == 'success' && !startsWith(inputs.version, '4.')
        timeout-minutes: 15
        run: |
          brew list --versions mingw-w64 > /dev/null || brew install -q mingw-w64
          scripts/anowine/check-env-aliases.sh "$RUNNER_TEMP/ours/Libraries/Ano" "$RUNNER_TEMP/bottle"

      # Plan 3c-2: DXVK and DXMT, rebuilt from source, load as themselves.
      - name: DXVK and DXMT load
        if: always() && steps.bottle.outcome == 'success'
        timeout-minutes: 15
        run: |
          brew list --versions mingw-w64 > /dev/null || brew install -q mingw-w64
          scripts/anowine/check-graphics.sh "$RUNNER_TEMP/ours/Libraries/Ano" "$RUNNER_TEMP/ours/Libraries" \
            "$RUNNER_TEMP/bottle"

      # Plan 3c-2, for comparison only: the prebuilt DXVK runtime 4.9.0 shipped, in
      # the same bottle (pins from build-engine.sh). A device that fails with both
      # is the runner, not the rebuild. (The prebuilt one still looks for Wine's
      # winevulkan.dll by name.)
      - name: Reference DXVK (prebuilt, as in 4.9.0)
        if: always() && steps.bottle.outcome == 'success' && !startsWith(inputs.version, '4.')
        continue-on-error: true
        timeout-minutes: 15
        run: |
          eval "$(grep -E '^DXVK_(VERSION|MAC_URL|MAC_SHA|UP_URL|UP_SHA)=' scripts/anowine/build-engine.sh)"
          R="$RUNNER_TEMP/refdxvk"
          mkdir -p "$R/dl" "$R/Libraries/DXVK"
          curl -fsSL --retry 3 -o "$R/dl/mac.tar.gz" "$DXVK_MAC_URL"
          curl -fsSL --retry 3 -o "$R/dl/up.tar.gz" "$DXVK_UP_URL"
          echo "$DXVK_MAC_SHA  $R/dl/mac.tar.gz" | shasum -a 256 -c -
          echo "$DXVK_UP_SHA  $R/dl/up.tar.gz" | shasum -a 256 -c -
          tar -xzf "$R/dl/mac.tar.gz" -C "$R/dl"
          tar -xzf "$R/dl/up.tar.gz" -C "$R/dl"
          cp -R "$R/dl/dxvk-macOS-async-v$DXVK_VERSION-20230507-repack/." "$R/Libraries/DXVK/"
          cp "$R/dl/dxvk-$DXVK_VERSION/x32/dxgi.dll" "$R/Libraries/DXVK/x32/dxgi.dll"
          ANO_GRAPHICS_SETS=DXVK scripts/anowine/check-graphics.sh "$RUNNER_TEMP/ours/Libraries/Ano" \
            "$R/Libraries" "$RUNNER_TEMP/bottle"

      # Plan 3c-2: a bottle as the app makes one, with no DLL overrides: wine-mono
      # installs from the engine and nothing offers a download (a dialog would hang
      # the boot, so it is stopped after ten minutes).
      - name: Default bottle from Ano's engine
        id: default_bottle
        if: always() && steps.unpack.outcome == 'success' && !startsWith(inputs.version, '4.')
        timeout-minutes: 15
        run: |
          A="$RUNNER_TEMP/ours/Libraries/Ano"
          export ANOPREFIX="$RUNNER_TEMP/bottle-default" DYLD_FALLBACK_LIBRARY_PATH="$A/lib" ANODEBUG=-all
          export ANODLLOVERRIDES="ano-dbg.exe=d"
          code=0
          perl -e 'alarm shift; exec @ARGV or die "exec: $!\n"' 600 "$A/bin/ano-loader" ano-boot --init \
            > "$RUNNER_TEMP/default-boot.log" 2>&1 || code=$?
          "$A/bin/ano-server" -k 2> /dev/null || true
          tail -n 40 "$RUNNER_TEMP/default-boot.log"
          if [ "$code" != 0 ]; then
            echo "::error::ano-boot --init exit $code$([ "$code" != 142 ] || echo ': stopped after 600 s (a dialog?)')"
            exit 1
          fi
          echo "system32: $(ls "$ANOPREFIX/drive_c/windows/system32" | wc -l) files"

      # Plan 3c-2: Gecko is not shipped and nothing offers to download it: asking
      # for it, as mshtml does, must return instead of opening a dialog that waits.
      - name: No Gecko download dialog
        if: always() && steps.default_bottle.outcome == 'success'
        timeout-minutes: 10
        run: |
          A="$RUNNER_TEMP/ours/Libraries/Ano"
          export ANOPREFIX="$RUNNER_TEMP/bottle-default" DYLD_FALLBACK_LIBRARY_PATH="$A/lib" ANODEBUG=-all
          export ANODLLOVERRIDES="ano-dbg.exe=d"
          code=0
          perl -e 'alarm shift; exec @ARGV or die "exec: $!\n"' 120 "$A/bin/ano-loader" control.exe appwiz.cpl \
            install_gecko > "$RUNNER_TEMP/gecko.log" 2>&1 || code=$?
          "$A/bin/ano-server" -k 2> /dev/null || true
          tail -n 20 "$RUNNER_TEMP/gecko.log"
          if [ "$code" = 142 ]; then echo "::error::asking for Gecko waited 120 s (a download dialog)"; exit 1; fi
          # Every bottle has system32\gecko\plugin (ano.inf); Gecko itself is xul.dll.
          if find "$ANOPREFIX/drive_c" -iname xul.dll | grep -q .; then echo "::error::Gecko was installed"; exit 1; fi
          echo "asking for Gecko returned (exit $code); nothing installed"

      - name: Mono runs a .NET program
        if: always() && steps.default_bottle.outcome == 'success'
        timeout-minutes: 15
        run: scripts/anowine/check-mono.sh "$RUNNER_TEMP/ours/Libraries/Ano" "$RUNNER_TEMP/bottle-default"

      # Plan 3c-2: mono's support installer ran in the default bottle (a broken one
      # now fails silently: no download dialog to fall back to), and that bottle,
      # the kind the app makes, passes the gate too.
      - name: Mono's support install and the default bottle's gate
        if: always() && steps.default_bottle.outcome == 'success'
        run: |
          B="$RUNNER_TEMP/bottle-default"
          missing=0
          for file in Microsoft.NET/Framework64/v4.0.30319/installutil.exe \
                      Microsoft.NET/Framework64/v1.1.4322/aspnet_regiis.exe; do
            [ -f "$B/drive_c/windows/$file" ] || { echo "::error::no windows/$file: the support install did not run"; missing=1; }
          done
          grep -q 'Ano Mono Windows Support' "$B/system.reg" \
            || { echo "::error::system.reg does not name Ano Mono Windows Support"; missing=1; }
          python3 scripts/anowine/wine_tokens.py "$B" --allowlist scripts/anowine/wine-allowlist.txt \
            --out "$RUNNER_TEMP/default-tokens.tsv" --gate || missing=1
          exit $missing

      # Plan 3c-3: the app's verbs with ano-tricks, called as the app calls them
      # (Winetricks+Install.swift), in the default bottle; then remove_mono (the
      # first thing dotnet48 does) must find mono by its renamed name, and the
      # bottle passes the gate. It changes the default bottle: keep it after the
      # steps that read that bottle.
      - name: The app's verbs with ano-tricks
        if: always() && steps.default_bottle.outcome == 'success'
        timeout-minutes: 60
        run: scripts/anowine/check-ano-tricks.sh "$RUNNER_TEMP/ours/Libraries/Ano" "$RUNNER_TEMP/bottle-default"

      # Plan 3c-4a, Task 7: the app's own code (WhiskyKit, through the ano CLI)
      # drives a bottle on Ano's engine, installed where the app keeps its runtime.
      - name: Xcode for the app's CLI
        if: always() && steps.unpack.outcome == 'success' && !startsWith(inputs.version, '4.')
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: The app's CLI on Ano's engine
        if: always() && steps.unpack.outcome == 'success' && !startsWith(inputs.version, '4.')
        timeout-minutes: 45
        run: |
          xcodebuild -project Whisky.xcodeproj -scheme WhiskyCmd -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/dd" build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/reports/cli-build.log" 2>&1 || { tail -n 40 "$RUNNER_TEMP/reports/cli-build.log"; exit 1; }
          scripts/anowine/check-app-on-engine.sh "$RUNNER_TEMP/dd/Build/Products/Debug/WhiskyCmd" \
            "$RUNNER_TEMP/ours/Libraries"

      # Plan 3c-2: what the app copies from Libraries/DXMT into a bottle
      # (Wine.swift, dxmtPrefixDLLs: the three front ends and the bridge).
      - name: DXMT payload as the app deploys it
        if: always() && steps.unpack.outcome == 'success' && !startsWith(inputs.version, '4.')
        run: |
          missing=0
          for arch in x64 x32; do
            for dll in d3d11 dxgi d3d10core anometal; do
              file="$RUNNER_TEMP/ours/Libraries/DXMT/$arch/$dll.dll"
              [ -f "$file" ] || { echo "::error::no Libraries/DXMT/$arch/$dll.dll"; missing=1; }
            done
          done
          exit $missing

      - name: Upload the inventory
        if: always() && steps.unpack.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: wine-tokens
          path: ${{ runner.temp }}/tokens.tsv
          if-no-files-found: warn

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: engine-compare
          path: ${{ runner.temp }}/reports
          if-no-files-found: warn
