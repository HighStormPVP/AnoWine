name: AnoWine Hygiene

# This fork is edited from Windows. Guard against CRLF scripts and lost
# executable bits, which break silently on macOS.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Line endings and exec bits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check hygiene
        run: bash "$GITHUB_WORKSPACE/scripts/anowine/check-hygiene.sh" "$GITHUB_WORKSPACE"

      # rename_binaries.py rewrites the engine's fonts with fontTools, pinned
      # as in build-engine.sh; without it the font tests are skipped.
      - name: fontTools
        run: python3 -m pip install --user --break-system-packages --quiet fonttools==4.57.0

      # rename_binaries.py renames wine-mono's support installer with msitools
      # and gcab; without them the MSI test is skipped.
      - name: msitools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends msitools gcab

      - name: Rebrand script tests
        run: python3 -m unittest discover -s "$GITHUB_WORKSPACE/scripts/anowine" -p 'test_*.py' -v

      # Plan 3c-3: Libraries/ano-tricks is winetricks 20260125 renamed by
      # make_ano_tricks.py; made again from the pinned upstream file, it must
      # equal the committed one.
      - name: ano-tricks is made from upstream
        if: ${{ !cancelled() }}
        run: python3 "$GITHUB_WORKSPACE/scripts/anowine/make_ano_tricks.py" --check

      - name: ano-tricks checks
        if: ${{ !cancelled() }}
        run: bash "$GITHUB_WORKSPACE/scripts/anowine/test-ano-tricks.sh" "$GITHUB_WORKSPACE"

      # Plan 3c-4a: the names the app passes to or expects from the engine,
      # the runtime, ano-tricks and a bottle are the renamed engine's.
      - name: The app's runtime names
        if: ${{ !cancelled() }}
        run: python3 "$GITHUB_WORKSPACE/scripts/anowine/check_app_runtime_names.py"

      - name: D3DMetal names script test
        if: ${{ !cancelled() }}
        run: bash "$GITHUB_WORKSPACE/scripts/anowine/test-list-gptk-wine-names.sh"

      - name: Engine configure gates test
        if: ${{ !cancelled() }}
        run: bash "$GITHUB_WORKSPACE/scripts/anowine/test-check-wine-config.sh"

      # Fails after an upstream merge brings new "Whisky" strings; fix by running
      # python3 scripts/anowine/rebrand_strings.py Whisky/Localizable.xcstrings
      # then python3 scripts/british-english.py
      - name: UI strings are rebranded
        if: ${{ !cancelled() }}
        run: python3 "$GITHUB_WORKSPACE/scripts/anowine/rebrand_strings.py" --check "$GITHUB_WORKSPACE/Whisky/Localizable.xcstrings"
