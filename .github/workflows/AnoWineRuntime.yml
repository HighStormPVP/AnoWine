name: AnoWine Runtime

# Builds AnoWine's Wine runtime (upstream's with renamed programs), smoke-tests
# it, optionally publishes it as release v3.1.2, and checks that the Pages
# plist advertises the published asset's exact digest.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/anowine/repack-runtime.sh'
      - 'scripts/anowine/check-runtime-digest.sh'
      - 'dist/pages/WhiskyWineVersion.plist'
      - '.github/workflows/AnoWineRuntime.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the built runtime as release v3.1.2'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build and smoke-test runtime
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rosetta
        run: /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license

      - name: Repack
        run: bash "$GITHUB_WORKSPACE/scripts/anowine/repack-runtime.sh" "$RUNNER_TEMP/out"

      - name: Smoke test - boot a prefix with the renamed programs
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          tar -xzf "$RUNNER_TEMP/out/Libraries.tar.gz" -C "$RUNNER_TEMP/smoke"
          BIN="$RUNNER_TEMP/smoke/Libraries/Wine/bin"
          export WINEPREFIX="$RUNNER_TEMP/smoke/prefix" WINESERVER="$BIN/anowine-server" WINEDEBUG=-all
          WINEDLLOVERRIDES="mscoree,mshtml=" "$BIN/anowine" wineboot -i
          "$WINESERVER" -w
          test -f "$WINEPREFIX/system.reg" && echo "prefix created with anowine + anowine-server"

      - name: Upload runtime
        uses: actions/upload-artifact@v7
        with:
          name: anowine-runtime
          path: ${{ runner.temp }}/out/Libraries.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release v3.1.2
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download runtime
        uses: actions/download-artifact@v8
        with:
          name: anowine-runtime
          path: out

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha256sum out/Libraries.tar.gz
          gh release create v3.1.2 --repo "$GITHUB_REPOSITORY" \
            --title "AnoWine Wine runtime v3.1.2" \
            --notes "Upstream frankea/Whisky runtime v3.1.1 (Wine 11.0) with wine64/wine renamed to anowine and wineserver to anowine-server. SHA-256: $(sha256sum out/Libraries.tar.gz | cut -d' ' -f1)" \
            out/Libraries.tar.gz

  digest:
    name: Pages plist matches published runtime
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check digest
        run: bash "$GITHUB_WORKSPACE/scripts/anowine/check-runtime-digest.sh" "$GITHUB_WORKSPACE"
