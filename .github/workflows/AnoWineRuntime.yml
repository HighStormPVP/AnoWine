name: AnoWine Runtime

# Builds Ano's Wine runtime 4.9.0 (upstream's engine v4.8.3 with renamed
# programs: the loader runs as ano-core and bin/ano-loader links to it,
# wineboot.exe is ano-boot.exe and winedevice.exe is ano-device.exe, which needs
# modules rebuilt from the engine's source), smoke-tests it, optionally
# publishes it as release v4.9.0, and checks that every runtime feed
# (dist/pages/WhiskyWineVersion*.plist) advertises its published asset's exact digest.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/anowine/repack-runtime.sh'
      - 'scripts/anowine/check-ano-core.sh'
      - 'scripts/anowine/check-ano-programs.sh'
      - 'scripts/anowine/check-modules.sh'
      - 'scripts/anowine/tests/**'
      - 'scripts/anowine/build-modules.sh'
      - 'scripts/anowine/patches/**'
      - '.github/workflows/AnoWineRuntime.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the built runtime as release v4.9.0'
        type: boolean
        default: false

permissions:
  contents: read

env:
  ENGINE_URL: https://github.com/frankea/Whisky/releases/download/v4.8.3/Libraries.tar.gz
  ENGINE_SHA256: 08ffabd7b7c352470faee2b1d51061b341316e401439ca805c5302acc2fb8818
  OLD_RUNTIME_URL: https://github.com/HighStormPVP/AnoWine/releases/download/v3.1.6/Libraries.tar.gz
  OLD_RUNTIME_SHA256: 412035519d2df986aebb5c3a72c5dd6b00162d3b5aa52c1fff1713928b521ead
  # Runtime 4.x reads upstream's WINE* names, so its checks use the winetricks the app
  # bundled before ano-tricks replaced it (Plan 3c-4a), pinned at its last commit.
  LEGACY_WINETRICKS_URL: https://raw.githubusercontent.com/HighStormPVP/AnoWine/c734db46c3716b78fc381735888aa2c4eca6d3be/Libraries/winetricks
  LEGACY_WINETRICKS_SHA256: f43967dbd067cf384e61adb640a21e45b6644b776cb34abb13301566374f0730

jobs:
  modules:
    name: Build the Wine modules that start renamed programs
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rosetta
        run: /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license

      - name: Build
        run: |
          bash "$GITHUB_WORKSPACE/scripts/anowine/build-modules.sh" "$RUNNER_TEMP/modules"             "$GITHUB_WORKSPACE/scripts/anowine/patches/ntdll-ano-core.patch"             "$GITHUB_WORKSPACE/scripts/anowine/patches/ano-programs.patch"             "$GITHUB_WORKSPACE/scripts/anowine/patches/ntdll-no-proctitle.patch"

      - name: Engine ntdll.so
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/engine.tar.gz
          key: engine-v4.8.3-08ffabd7b7c3

      - name: Extract the engine's ntdll.so
        run: |
          [ -f "$RUNNER_TEMP/engine.tar.gz" ] || curl -fsSL -o "$RUNNER_TEMP/engine.tar.gz" "$ENGINE_URL"
          echo "$ENGINE_SHA256  $RUNNER_TEMP/engine.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/engine"
          tar -xzf "$RUNNER_TEMP/engine.tar.gz" -C "$RUNNER_TEMP/engine" Libraries/Wine/lib/wine/x86_64-unix/ntdll.so

      - name: Modules match the engine
        run: |
          bash "$GITHUB_WORKSPACE/scripts/anowine/check-modules.sh" "$RUNNER_TEMP/modules"             "$RUNNER_TEMP/engine/Libraries/Wine/lib/wine/x86_64-unix/ntdll.so"

      - name: Upload modules
        uses: actions/upload-artifact@v7
        with:
          name: wine-modules
          path: ${{ runner.temp }}/modules
          if-no-files-found: error

  build:
    name: Build and smoke-test runtime
    needs: modules
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rosetta
        run: /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license

      - name: Download modules
        uses: actions/download-artifact@v8
        with:
          name: wine-modules
          path: ${{ runner.temp }}/modules

      - name: Repack
        run: bash "$GITHUB_WORKSPACE/scripts/anowine/repack-runtime.sh" "$RUNNER_TEMP/out" "$RUNNER_TEMP/modules"

      - name: Smoke test - boot a prefix with the renamed programs
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          tar -xzf "$RUNNER_TEMP/out/Libraries.tar.gz" -C "$RUNNER_TEMP/smoke"
          bash "$GITHUB_WORKSPACE/scripts/anowine/check-ano-core.sh" "$RUNNER_TEMP/smoke/Libraries" --boot

      - name: Runtime 3.1.6 (older bottles, negative check)
        run: |
          mkdir -p "$RUNNER_TEMP/old"
          curl -fsSL -o "$RUNNER_TEMP/old.tar.gz" "$OLD_RUNTIME_URL"
          echo "$OLD_RUNTIME_SHA256  $RUNNER_TEMP/old.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/old.tar.gz" -C "$RUNNER_TEMP/old"

      - name: Checks reject runtime 3.1.6
        run: |
          if bash "$GITHUB_WORKSPACE/scripts/anowine/check-ano-core.sh" "$RUNNER_TEMP/old/Libraries"; then
            echo "::error::check-ano-core accepted a 3.1.x runtime"; exit 1
          fi

      - name: Smoke test - ano-boot and ano-device work, from new and older bottles
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/winetricks" "$LEGACY_WINETRICKS_URL"
          echo "$LEGACY_WINETRICKS_SHA256  $RUNNER_TEMP/winetricks" | shasum -a 256 -c -
          bash "$GITHUB_WORKSPACE/scripts/anowine/check-ano-programs.sh" "$RUNNER_TEMP/smoke/Libraries" --boot             --exitwindows "$RUNNER_TEMP/modules/tests/exitwindows.exe"             --upgrade-from "$RUNNER_TEMP/old/Libraries"             --winetricks "$RUNNER_TEMP/winetricks"

      - name: Upload runtime
        uses: actions/upload-artifact@v7
        with:
          name: anowine-runtime
          path: ${{ runner.temp }}/out/Libraries.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release v4.9.0
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download runtime
        uses: actions/download-artifact@v8
        with:
          name: anowine-runtime
          path: out

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha256sum out/Libraries.tar.gz
          gh release create v4.9.0 --repo "$GITHUB_REPOSITORY" \
            --title "Ano Wine runtime v4.9.0" \
            --notes "Ano's Wine runtime 4.9.0, for Ano 8 and later (earlier Ano versions stay on v3.1.6). Upstream frankea/Whisky engine v4.8.3: Wine 11.19 with CrossOver's macOS patches (dappermint/winecx 9f3f644), built by frankea/winecx-gptk CI at 12af865. Ano's names: the loader runs as ano-core and bin/ano-loader links to it, wineserver is ano-server, wineboot.exe is ano-boot.exe and winedevice.exe is ano-device.exe, and ntdll.so neither renames its process nor overwrites its arguments. The modules that start these by name are rebuilt from the engine's own source with scripts/anowine/patches/. GPTK-capable: D3DMetal deploys when you import Apple's Game Porting Toolkit. SHA-256: $(sha256sum out/Libraries.tar.gz | cut -d' ' -f1)" \
            out/Libraries.tar.gz

  digest:
    name: Runtime feeds match published runtimes
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check every feed's digest
        run: bash "$GITHUB_WORKSPACE/scripts/anowine/check-runtime-digest.sh" "$GITHUB_WORKSPACE"
