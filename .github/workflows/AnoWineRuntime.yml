name: AnoWine Runtime

# Builds AnoWine's Wine runtime (upstream's with renamed programs: the loader
# runs as ano-core, wineboot.exe is ano-boot.exe and winedevice.exe is
# ano-device.exe, which needs rebuilt modules), smoke-tests it, optionally
# publishes it as release v3.1.6, and checks that the Pages
# plist advertises the published asset's exact digest.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/anowine/repack-runtime.sh'
      - 'scripts/anowine/check-runtime-digest.sh'
      - 'scripts/anowine/check-ano-core.sh'
      - 'scripts/anowine/check-ano-programs.sh'
      - 'scripts/anowine/check-modules.sh'
      - 'scripts/anowine/tests/**'
      - 'scripts/anowine/build-modules.sh'
      - 'scripts/anowine/patches/**'
      - 'dist/pages/WhiskyWineVersion.plist'
      - '.github/workflows/AnoWineRuntime.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the built runtime as release v3.1.6'
        type: boolean
        default: false

permissions:
  contents: read

env:
  ENGINE_URL: https://github.com/frankea/Whisky/releases/download/v4.8.3/Libraries.tar.gz
  ENGINE_SHA256: 08ffabd7b7c352470faee2b1d51061b341316e401439ca805c5302acc2fb8818
  OLD_RUNTIME_URL: https://github.com/HighStormPVP/AnoWine/releases/download/v3.1.6/Libraries.tar.gz
  OLD_RUNTIME_SHA256: 412035519d2df986aebb5c3a72c5dd6b00162d3b5aa52c1fff1713928b521ead

jobs:
  modules:
    name: Build the Wine modules that start renamed programs
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rosetta
        run: /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license

      - name: Build
        run: |
          bash "$GITHUB_WORKSPACE/scripts/anowine/build-modules.sh" "$RUNNER_TEMP/modules"             "$GITHUB_WORKSPACE/scripts/anowine/patches/ntdll-ano-core.patch"             "$GITHUB_WORKSPACE/scripts/anowine/patches/ano-programs.patch"             "$GITHUB_WORKSPACE/scripts/anowine/patches/ntdll-no-proctitle.patch"

      - name: Engine ntdll.so
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/engine.tar.gz
          key: engine-v4.8.3-08ffabd7b7c3

      - name: Extract the engine's ntdll.so
        run: |
          [ -f "$RUNNER_TEMP/engine.tar.gz" ] || curl -fsSL -o "$RUNNER_TEMP/engine.tar.gz" "$ENGINE_URL"
          echo "$ENGINE_SHA256  $RUNNER_TEMP/engine.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/engine"
          tar -xzf "$RUNNER_TEMP/engine.tar.gz" -C "$RUNNER_TEMP/engine" Libraries/Wine/lib/wine/x86_64-unix/ntdll.so

      - name: Modules match the engine
        run: |
          bash "$GITHUB_WORKSPACE/scripts/anowine/check-modules.sh" "$RUNNER_TEMP/modules"             "$RUNNER_TEMP/engine/Libraries/Wine/lib/wine/x86_64-unix/ntdll.so"

      - name: Upload modules
        uses: actions/upload-artifact@v7
        with:
          name: wine-modules
          path: ${{ runner.temp }}/modules
          if-no-files-found: error

  build:
    name: Build and smoke-test runtime
    needs: modules
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rosetta
        run: /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license

      - name: Download modules
        uses: actions/download-artifact@v8
        with:
          name: wine-modules
          path: ${{ runner.temp }}/modules

      - name: Repack
        run: bash "$GITHUB_WORKSPACE/scripts/anowine/repack-runtime.sh" "$RUNNER_TEMP/out" "$RUNNER_TEMP/modules"

      - name: Smoke test - boot a prefix with the renamed programs
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          tar -xzf "$RUNNER_TEMP/out/Libraries.tar.gz" -C "$RUNNER_TEMP/smoke"
          bash "$GITHUB_WORKSPACE/scripts/anowine/check-ano-core.sh" "$RUNNER_TEMP/smoke/Libraries" --boot

      - name: Runtime 3.1.6 (older bottles, negative check)
        run: |
          mkdir -p "$RUNNER_TEMP/old"
          curl -fsSL -o "$RUNNER_TEMP/old.tar.gz" "$OLD_RUNTIME_URL"
          echo "$OLD_RUNTIME_SHA256  $RUNNER_TEMP/old.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/old.tar.gz" -C "$RUNNER_TEMP/old"

      - name: Checks reject runtime 3.1.6
        run: |
          if bash "$GITHUB_WORKSPACE/scripts/anowine/check-ano-core.sh" "$RUNNER_TEMP/old/Libraries"; then
            echo "::error::check-ano-core accepted a 3.1.x runtime"; exit 1
          fi

      - name: Smoke test - ano-boot and ano-device work, from new and older bottles
        run: |
          bash "$GITHUB_WORKSPACE/scripts/anowine/check-ano-programs.sh" "$RUNNER_TEMP/smoke/Libraries" --boot             --exitwindows "$RUNNER_TEMP/modules/tests/exitwindows.exe"             --upgrade-from "$RUNNER_TEMP/old/Libraries"             --winetricks "$GITHUB_WORKSPACE/Libraries/winetricks"

      - name: Upload runtime
        uses: actions/upload-artifact@v7
        with:
          name: anowine-runtime
          path: ${{ runner.temp }}/out/Libraries.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release v3.1.6
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download runtime
        uses: actions/download-artifact@v8
        with:
          name: anowine-runtime
          path: out

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha256sum out/Libraries.tar.gz
          gh release create v3.1.6 --repo "$GITHUB_REPOSITORY" \
            --title "AnoWine Wine runtime v3.1.6" \
            --notes "Upstream frankea/Whisky runtime v3.1.1 (Wine 11.0) with wine64/wine renamed to ano-loader, wineserver to ano-server, the loader lib/wine/x86_64-unix/wine to ano-core, wineboot.exe to ano-boot.exe and winedevice.exe to ano-device.exe (the modules that start them rebuilt from Wine 11.0 with scripts/anowine/patches/*.patch); ntdll.so no longer sets the program name or overwrites the process arguments with the Windows program. SHA-256: $(sha256sum out/Libraries.tar.gz | cut -d' ' -f1)" \
            out/Libraries.tar.gz

  digest:
    name: Pages plist matches published runtime
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check digest
        run: bash "$GITHUB_WORKSPACE/scripts/anowine/check-runtime-digest.sh" "$GITHUB_WORKSPACE"
