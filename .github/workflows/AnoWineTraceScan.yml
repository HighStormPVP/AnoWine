name: AnoWine Trace Scan

# Inventory of every trace of "wine" a bottle leaves on the Mac (processes,
# environments, files, registry) while a bottle is created, programs and Wine
# tools run, and winetricks runs. See scripts/anowine/scan-wine-traces.sh.
# Reports only; the report is the job summary and the wine-traces artifact.

on:
  push:
    branches: [main]
    paths:
      - 'scripts/anowine/scan-wine-traces.sh'
      - '.github/workflows/AnoWineTraceScan.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  RUNTIME_URL: https://github.com/HighStormPVP/AnoWine/releases/download/v4.9.0/Libraries.tar.gz
  RUNTIME_SHA256: 7951aa539c1e0f371b4f5083c31599e582f902c33f80617321d745cc164743e5
  # Runtime 4.x reads upstream's WINE* names, so its checks use the winetricks the app
  # bundled before ano-tricks replaced it (Plan 3c-4a), pinned at its last commit.
  LEGACY_WINETRICKS_URL: https://raw.githubusercontent.com/HighStormPVP/AnoWine/c734db46c3716b78fc381735888aa2c4eca6d3be/Libraries/winetricks
  LEGACY_WINETRICKS_SHA256: f43967dbd067cf384e61adb640a21e45b6644b776cb34abb13301566374f0730

jobs:
  scan:
    name: Scan a bottle for wine traces
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rosetta
        run: /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license

      - name: Cache runtime
        id: runtime-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/runtime.tar.gz
          key: ano-runtime-${{ env.RUNTIME_SHA256 }}

      - name: Runtime v4.9.0
        run: |
          [ -f "$RUNNER_TEMP/runtime.tar.gz" ] || curl -fsSL -o "$RUNNER_TEMP/runtime.tar.gz" "$RUNTIME_URL"
          echo "$RUNTIME_SHA256  $RUNNER_TEMP/runtime.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/runtime"
          tar -xzf "$RUNNER_TEMP/runtime.tar.gz" -C "$RUNNER_TEMP/runtime"

      - name: Scan
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/winetricks" "$LEGACY_WINETRICKS_URL"
          echo "$LEGACY_WINETRICKS_SHA256  $RUNNER_TEMP/winetricks" | shasum -a 256 -c -
          bash "$GITHUB_WORKSPACE/scripts/anowine/scan-wine-traces.sh" "$RUNNER_TEMP/runtime/Libraries" \
            "$RUNNER_TEMP/winetricks" "$RUNNER_TEMP/report"
          cat "$RUNNER_TEMP/report/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wine-traces
          path: ${{ runner.temp }}/report
          if-no-files-found: warn
