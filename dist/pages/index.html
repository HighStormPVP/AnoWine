<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AnoWine</title>
  <meta name="description" content="AnoWine: Windows games on Apple Silicon Macs, with a built-in proxy. Built on frankea/Whisky.">
  <style>
    :root { --bg: #ffffff; --fg: #1d1d1f; --muted: #6e6e73; --link: #3a2070; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111113; --fg: #f5f5f7; --muted: #a1a1a6; --link: #b9a3ff; }
    }
    body { margin: 0; background: var(--bg); color: var(--fg);
           font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 64px 16px; }
    h1 { font-size: 40px; margin: 0 0 8px; }
    p { margin: 0 0 16px; }
    .muted { color: var(--muted); }
    a { color: var(--link); }
  </style>
</head>
<body>
  <main>
    <h1>AnoWine</h1>
    <p class="muted">Windows games on Apple Silicon Macs, with a built-in proxy.</p>
    <p>AnoWine is an early, open-source project built on
      <a href="https://github.com/frankea/Whisky">frankea/Whisky</a> and licensed under the GPL-3.
      It isn't affiliated with Whisky, frankea/Whisky or getwhisky.app.</p>
    <p>Source, test builds and status:
      <a href="https://github.com/HighStormPVP/AnoWine">github.com/HighStormPVP/AnoWine</a>.</p>
  </main>
</body>
</html>
